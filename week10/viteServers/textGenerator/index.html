  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textgen</title>
  </head>
  <body>
    <header>
      <div>Step 1:
        <button id="fetchTEXT">Fetch some text</button>

        <input type="radio" id="ngramSelection" name="unitType">

    <p id ="outputText"></p >
    
    <div id="app"></div>
